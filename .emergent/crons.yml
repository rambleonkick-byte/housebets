crons:
  - name: auto-cashout
    description: "Backstop check that cashes out bets whose auto cash-out target has been reached"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/auto-cashout"
    method: POST
    enabled: true
